name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'BulkRNASeq/**'

permissions:
  contents: read
  packages: write

jobs:
  # Detect which module subfolders were actually modified in this push,
  # so the build-and-push matrix below can skip untouched images.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Detect changed module paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            qc_report:
              - 'BulkRNASeq/qc_report/**'
            skewer:
              - 'BulkRNASeq/skewer/**'
            rsemstarindex:
              - 'BulkRNASeq/rsemstarindex/**'
            rsemstar:
              - 'BulkRNASeq/rsemstar/**'
            annotation:
              - 'BulkRNASeq/annotation/**'
            pca:
              - 'BulkRNASeq/pca/**'
            pca:
              - 'BulkRNASeq/deseq2/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # Define module configuration mapping custom image names to directory paths.
        # "filter" must match a key defined in the detect-changes job above.
        include:
          - name: docker4seq-qc_report-v2
            path: BulkRNASeq/qc_report
            filter: qc_report
          - name: docker4seq-skewer-v2
            path: BulkRNASeq/skewer
            filter: skewer
          - name: docker4seq-rsemstarindex-v2
            path: BulkRNASeq/rsemstarindex
            filter: rsemstarindex
          - name: docker4seq-rsemstar-v2
            path: BulkRNASeq/rsemstar
            filter: rsemstar
          - name: docker4seq-annotation-v2
            path: BulkRNASeq/annotation
            filter: annotation
          - name: docker4seq-pca-v2
            path: BulkRNASeq/pca
            filter: pca
          - name: docker4seq-deseq2-v2
            path: BulkRNASeq/deseq2
            filter: deseq2



    steps:
      # Every step below is skipped (shown as "skipped", not failed) when this
      # module's path did not change, since matrix is only available in steps,
      # not in a job-level "if".
      - name: Checkout repository source code
        if: contains(fromJSON(needs.detect-changes.outputs.changes), matrix.filter)
        uses: actions/checkout@v4

      - name: Lowercase repository owner name
        if: contains(fromJSON(needs.detect-changes.outputs.changes), matrix.filter)
        run: |
          echo "OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Authenticate to GitHub Container Registry (GHCR)
        if: contains(fromJSON(needs.detect-changes.outputs.changes), matrix.filter)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: contains(fromJSON(needs.detect-changes.outputs.changes), matrix.filter)
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        if: contains(fromJSON(needs.detect-changes.outputs.changes), matrix.filter)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.path }}
          file: ./${{ matrix.path }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/${{ matrix.name }}:latest
